apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaos-api
  template:
    metadata:
      labels:
        app: chaos-api
    spec:
      containers:
        - name: chaos-api
          image: chaos-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          
          livenessProbe:
           httpGet:
            path: /health
            port: 8000
           initialDelaySeconds: 5
           periodSeconds: 10
          readinessProbe:
            httpGet:
             path: /health
             port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5