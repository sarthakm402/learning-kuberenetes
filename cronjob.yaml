
apiVersion: batch/v1
kind: CronJob
metadata:
  name: document-processing-schedule
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: processor
              image: busybox:1.36
              command:
                - sh
                - -c
                - 'echo "Scheduled processing started at $(date)"; sleep 3; echo "Processing complete!"'
          restartPolicy: Never
